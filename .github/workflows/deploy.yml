name: Testen & veröffentlichen

# GitHub Pages ist auf „Deploy from a branch: main / docs“ eingestellt.
# Dieser Workflow testet jeden Push und hält den gebauten Ordner docs/ aktuell.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:docs
      - name: docs/ aktualisieren, falls sich der Build geändert hat
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Build docs/ für GitHub Pages aktualisieren"
            git push
          else
            echo "docs/ ist aktuell."
          fi
